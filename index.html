<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Beautiful AI-powered weather forecasts — get current conditions or 5-day forecasts for any city worldwide.">
    <title>N8Neather — AI Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated background -->
    <canvas id="bgCanvas"></canvas>
    <div class="aurora"></div>

    <main class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="8" fill="url(#sunGrad)" />
                    <path
                        d="M20 6v4M20 30v4M6 20h4M30 20h4M10.3 10.3l2.8 2.8M26.9 26.9l2.8 2.8M10.3 29.7l2.8-2.8M26.9 13.1l2.8-2.8"
                        stroke="url(#rayGrad)" stroke-width="2" stroke-linecap="round" />
                    <path
                        d="M24 26c4.4 0 8-2.7 8-6s-3.6-6-8-6c-.5-3.3-3.5-6-7-6s-6.5 2.7-7 6c-4.4 0-8 2.7-8 6s3.6 6 8 6h14z"
                        fill="url(#cloudGrad)" opacity="0.6" />
                    <defs>
                        <linearGradient id="sunGrad" x1="12" y1="12" x2="28" y2="28">
                            <stop stop-color="#FBBF24" />
                            <stop offset="1" stop-color="#F59E0B" />
                        </linearGradient>
                        <linearGradient id="rayGrad" x1="6" y1="6" x2="34" y2="34">
                            <stop stop-color="#FCD34D" />
                            <stop offset="1" stop-color="#F59E0B" />
                        </linearGradient>
                        <linearGradient id="cloudGrad" x1="2" y1="14" x2="32" y2="26">
                            <stop stop-color="rgba(255,255,255,0.9)" />
                            <stop offset="1" stop-color="rgba(200,220,255,0.7)" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>OmniSky</h1>
            </div>
            <p class="tagline">AI-Powered Weather Intelligence</p>
        </header>

        <!-- Main Card -->
        <section class="card" id="mainCard">
            <!-- Search -->
            <div class="search-group">
                <div class="input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="text" id="cityInput" placeholder="Search any city..." autocomplete="off"
                        spellcheck="false" />
                </div>
                <button id="searchBtn" aria-label="Get weather">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <!-- Toggle -->
            <div class="toggle-group">
                <span class="toggle-label active" id="labelToday">Today</span>
                <label class="toggle-switch" for="forecastToggle">
                    <input type="checkbox" id="forecastToggle" />
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label" id="labelForecast">5-Day Forecast</span>
            </div>

            <!-- Result area -->
            <div class="result-area" id="resultArea">
                <div class="placeholder-state" id="placeholderState">
                    <svg class="placeholder-icon" viewBox="0 0 80 80" fill="none">
                        <circle cx="32" cy="32" r="14" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
                        <path
                            d="M32 18v4M32 42v4M18 32h4M42 32h4M22.2 22.2l2.8 2.8M38.4 38.4l2.8 2.8M22.2 41.8l2.8-2.8M38.4 25.6l2.8-2.8"
                            stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linecap="round" />
                        <path d="M38 48a12 12 0 0 0 12-8 10 10 0 0 0-8-18 14 14 0 0 0-26 4 10 10 0 0 0 2 20h20z"
                            stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" />
                    </svg>
                    <p>Enter a city to discover the weather</p>
                </div>

                <div class="loading-state hidden" id="loadingState">
                    <div class="loader">
                        <div class="loader-ring"></div>
                        <div class="loader-ring"></div>
                        <div class="loader-ring"></div>
                    </div>
                    <p>Fetching weather intelligence...</p>
                </div>

                <div class="weather-result hidden" id="weatherResult">
                    <div class="result-header">
                        <h2 id="resultCity"></h2>
                        <span class="result-badge" id="resultBadge">Today</span>
                    </div>
                    <div class="result-text" id="resultText"></div>
                </div>

                <div class="error-state hidden" id="errorState">
                    <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 8v4M12 16h.01" />
                    </svg>
                    <p id="errorMessage">Something went wrong. Please try again.</p>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by <strong>n8n</strong> · OpenWeatherMap · Google Gemini</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>

</html>
